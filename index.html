<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Timed Breathing - Pranayama App</title>

    <style>
        :root {
            --ball-red: #e74c3c;
            --path-blue: #3498db;
            --path-green: #2ecc71;
            --text-dark: #2c3e50;
            --bg-light: #f4f7f6;
            --grad-color-1: #eef2f3;
            --grad-color-2: #8e9eab;
            --grad-stop: 50%;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-light);
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        #timer { 
            font-size: clamp(1.8rem, 5vw, 2.5rem); 
            font-weight: 700; 
            margin-top: 10px; 
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            color: #7f8c8d;
        }

        #status-text { 
            font-size: clamp(1.1rem, 4vw, 1.4rem); 
            height: 1.6rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin: 10px 0; 
            color: var(--path-blue);
            text-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .viewport {
            position: relative;
            width: 100vw; 
            height: 45vh;
            background: radial-gradient(circle at center, var(--grad-color-1) 0%, var(--grad-color-1) var(--grad-stop), var(--grad-color-2) 100%);
            border-top: 1px solid rgba(0,0,0,0.1); 
            border-bottom: 1px solid rgba(0,0,0,0.1);
            overflow: hidden;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.05);
        }

        #hud {
            position: absolute; 
            top: 20px; 
            left: 20px;
            z-index: 200; 
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
            min-width: 100px;
        }
        #hud-label { font-size: 0.7rem; letter-spacing: 1.5px; font-weight: 800; color: #95a5a6; text-transform: uppercase; margin-bottom: 2px; }
        #breath-count { font-size: 2.5rem; font-weight: 900; line-height: 1; color: var(--text-dark); }

        #track { position: absolute; left: 50%; top: 50%; will-change: transform; z-index: 5; }
        .segment { position: absolute; box-sizing: border-box; --progress: 0%; }
        
        .inhale { border-left: 14px solid; border-image: linear-gradient(to top, var(--path-green) var(--progress), var(--path-blue) var(--progress)) 1; }
        .hold-top { border-top: 14px solid; border-image: linear-gradient(to right, var(--path-green) var(--progress), var(--path-blue) var(--progress)) 1; }
        .exhale { border-left: 14px solid; border-image: linear-gradient(to bottom, var(--path-green) var(--progress), var(--path-blue) var(--progress)) 1; }
        .hold-bottom { border-bottom: 14px solid; border-image: linear-gradient(to right, var(--path-green) var(--progress), var(--path-blue) var(--progress)) 1; }

        #ball {
            position: absolute; left: 50%; top: 50%;
            width: 42px; height: 42px;
            background: var(--ball-red);
            border: 4px solid #fff; 
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(1);
            z-index: 100; 
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.3);
            transition: none; 
        }

        .controls-container {
            margin-top: 15px; padding: 20px;
            background: white; border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            width: 100%; max-width: 600px;
        }

        .inputs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; }
        @media (min-width: 600px) { .inputs { grid-template-columns: repeat(4, 1fr); } }

        .input-group { text-align: center; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.7rem; font-weight: bold; color: #95a5a6; text-transform: uppercase; letter-spacing: 1px; }

        input[type="number"] { width: 100%; padding: 10px; border: 2px solid #edf2f4; border-radius: 12px; text-align: center; font-size: 1.1rem; font-weight: 700; color: var(--text-dark); }
        
        #btn {
            padding: 16px 60px; font-size: 1rem; background: var(--text-dark); color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s; width: 100%;
        }
        #btn:hover { background: #000; transform: translateY(-2px); }

        .gradient-lab {
            margin-top: 20px; padding: 12px 20px; background: white; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 12px; width: 100%; max-width: 400px;
        }
        
        input[type="color"] { border: none; width: 32px; height: 32px; cursor: pointer; background: none; border-radius: 6px; padding: 0; }
        input[type="range"] { flex-grow: 1; height: 4px; border-radius: 5px; appearance: none; background: #edf2f4; outline: none; }
        input[type="range"]::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; background: #95a5a6; border-radius: 50%; cursor: pointer; }

        #summary-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 40px; border-radius: 30px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.2); max-width: 400px; width: 90%;
        }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 30px 0; }
        .stat-box { background: #f8f9fa; padding: 15px; border-radius: 15px; }
        .stat-val { display: block; font-size: 1.8rem; font-weight: 900; color: var(--path-blue); }
        .stat-lbl { font-size: 0.7rem; text-transform: uppercase; font-weight: bold; color: #95a5a6; }
        .modal-close { background: var(--text-dark); color: white; border: none; padding: 12px 30px; border-radius: 50px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .hidden { display: none !important; }
    </style>
</head>

<body>
    <!-- Session Timer & Current Phase Indicator -->
    <div id="timer">00:00:00</div>
    <div id="status-text">Ready</div>

    <!-- Animated Breathing Viewport -->
    <div class="viewport" id="viewport">
        <div id="hud">
            <div id="hud-label">Breath</div>
            <div id="breath-count">0</div>
        </div>
        <div id="ball"></div>
        <div id="track"></div>
    </div>

    <!-- Timing Controls -->
    <div class="controls-container">
        <div class="inputs" id="inputWrapper">
            <div class="input-group"><label>Inhale</label><input id="inT" min="1" type="number" value="5"/></div>
            <div class="input-group"><label>Hold</label><input id="h1T" min="0" type="number" value="5"/></div>
            <div class="input-group"><label>Exhale</label><input id="outT" min="1" type="number" value="5"/></div>
            <div class="input-group"><label>Hold</label><input id="h2T" min="0" type="number" value="5"/></div>
        </div>
        <button id="btn">Begin Practice</button>
    </div>

    <!-- Background Gradient Customizer -->
    <div class="gradient-lab" id="labWrapper">
        <input id="color1" oninput="updateGradient()" type="color" value="#eef2f3"/>
        <input id="stopRange" max="100" min="0" oninput="updateGradient()" type="range" value="50"/>
        <input id="color2" oninput="updateGradient()" type="color" value="#8e9eab"/>
    </div>

    <!-- Session Summary Modal -->
    <div id="summary-modal">
        <div class="modal-content">
            <h2>Session Complete</h2>
            <div class="stat-grid">
                <div class="stat-box">
                    <span class="stat-val" id="final-breaths">0</span>
                    <span class="stat-lbl">Total Breaths</span>
                </div>
                <div class="stat-box">
                    <span class="stat-val" id="final-time">00:00</span>
                    <span class="stat-lbl">Duration</span>
                </div>
            </div>
            <button class="modal-close" id="restart-btn">Start New Session</button>
        </div>
    </div>

    <script>
        let isRunning = false;
        let audioCtx;
        let lastEndTop = 0;
        let lastEndLeft = 0;
        let breathCounter = 0;
        let sessionSeconds = 0;
        let trackSegments = [];
        const SCALE = 60;

        const track = document.getElementById('track');
        const ball = document.getElementById('ball');
        const status = document.getElementById('status-text');
        const countDisplay = document.getElementById('breath-count');
        const btn = document.getElementById('btn');
        const modal = document.getElementById('summary-modal');
        const restartBtn = document.getElementById('restart-btn');

        window.onload = function() {
            try {
                const savedC1 = localStorage.getItem('pranayama-c1');
                const savedC2 = localStorage.getItem('pranayama-c2');
                const savedStop = localStorage.getItem('pranayama-stop');

                if (savedC1) document.getElementById('color1').value = savedC1;
                if (savedC2) document.getElementById('color2').value = savedC2;
                if (savedStop) document.getElementById('stopRange').value = savedStop;
            } catch (e) {
                // Ignore storage errors in sandboxed frames
            }
            updateGradient();
        };

        function updateGradient() {
            const c1 = document.getElementById('color1').value;
            const c2 = document.getElementById('color2').value;
            const stop = document.getElementById('stopRange').value;
            
            document.documentElement.style.setProperty('--grad-color-1', c1);
            document.documentElement.style.setProperty('--grad-color-2', c2);
            document.documentElement.style.setProperty('--grad-stop', stop + '%');

            try {
                localStorage.setItem('pranayama-c1', c1);
                localStorage.setItem('pranayama-c2', c2);
                localStorage.setItem('pranayama-stop', stop);
            } catch (e) {
                // Ignore storage errors
            }
        }

        async function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            return audioCtx;
        }

        async function playBreathSound(dur, rising) {
            const ctx = await initAudio();
            const buffer = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1);
            const src = ctx.createBufferSource();
            src.buffer = buffer;
            const filter = ctx.createBiquadFilter();
            filter.type = "lowpass";
            filter.frequency.setValueAtTime(rising ? 100 : 800, ctx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(rising ? 1200 : 100, ctx.currentTime + dur);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + Math.min(0.8, dur * 0.4));
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + dur);
            src.connect(filter).connect(gain).connect(ctx.destination);
            src.start();
        }

        async function playTempleBell(dur) {
            const ctx = await initAudio();
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.frequency.setValueAtTime(1480, now);
            g.gain.setValueAtTime(0, now);
            g.gain.linearRampToValueAtTime(0.1, now + 0.01);
            g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
            osc.connect(g).connect(ctx.destination);
            osc.start(now);
            osc.stop(now + dur);
        }

        function createSegment(w, h, top, left, type) {
            const div = document.createElement('div');
            div.className = `segment ` + type;
            div.style.width = Math.max(w, 14) + 'px';
            div.style.height = Math.max(h, 14) + 'px';
            div.style.top = top + 'px';
            div.style.left = left + 'px';
            track.appendChild(div);
            return div;
        }

        function buildCycle() {
            const tIn = parseFloat(document.getElementById('inT').value) || 1;
            const tH1 = Math.max(0, parseFloat(document.getElementById('h1T').value) || 0);
            const tOut = parseFloat(document.getElementById('outT').value) || 1;
            const tH2 = Math.max(0, parseFloat(document.getElementById('h2T').value) || 0);

            trackSegments.push(createSegment(14, tIn * SCALE, lastEndTop - (tIn * SCALE), lastEndLeft, 'inhale'));
            lastEndTop -= (tIn * SCALE);

            if (tH1 > 0) {
                trackSegments.push(createSegment(tH1 * SCALE, 14, lastEndTop, lastEndLeft, 'hold-top'));
                lastEndLeft += (tH1 * SCALE);
            }

            const exhaleSeg = createSegment(14, tOut * SCALE, lastEndTop, lastEndLeft, 'exhale');
            exhaleSeg.dataset.endOfCycle = (tH2 <= 0) ? 'true' : 'false';
            trackSegments.push(exhaleSeg);
            lastEndTop += (tOut * SCALE);

            if (tH2 > 0) {
                const holdBottomSeg = createSegment(tH2 * SCALE, 14, lastEndTop, lastEndLeft, 'hold-bottom');
                holdBottomSeg.dataset.endOfCycle = 'true';
                trackSegments.push(holdBottomSeg);
                lastEndLeft += (tH2 * SCALE);
            }
        }

        async function engine() {
            lastEndLeft = -2500;
            lastEndTop = 0;
            track.innerHTML = ''; 
            trackSegments = [];
            for (let i = 0; i < 15; i++) buildCycle();

            let idx = trackSegments.findIndex(seg => seg.classList.contains('inhale'));
            if (idx === -1) idx = 0;

            while (isRunning) {
                if (idx >= trackSegments.length - 8) buildCycle();
                const seg = trackSegments[idx];
                const type = seg.classList[1];
                let dur, label;

                if (type === 'inhale') {
                    dur = parseFloat(document.getElementById('inT').value) || 1;
                    label = "Inhale";
                    status.style.color = "var(--path-green)";
                } else if (type.includes('hold')) {
                    dur = type === 'hold-top'
                        ? (parseFloat(document.getElementById('h1T').value) || 0)
                        : (parseFloat(document.getElementById('h2T').value) || 0);
                    label = "Hold";
                    status.style.color = "var(--path-blue)";
                } else {
                    dur = parseFloat(document.getElementById('outT').value) || 1;
                    label = "Exhale";
                    status.style.color = "var(--ball-red)";
                }

                // Skip zero-duration segments so neither audio nor voice plays
                if (dur <= 0) {
                    if (seg.dataset.endOfCycle === 'true' && isRunning) {
                        breathCounter++;
                        countDisplay.innerText = breathCounter;
                    }
                    idx++;
                    continue;
                }

                status.innerText = label;
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(label);
                    window.speechSynthesis.speak(utter);
                }

                if (type === 'inhale') playBreathSound(dur, true);
                else if (type === 'exhale') playBreathSound(dur, false);
                else playTempleBell(Math.min(dur, 8));

                let tx = -parseFloat(seg.style.left);
                let ty = -parseFloat(seg.style.top);
                if (type === 'exhale') ty = -(parseFloat(seg.style.top) + parseFloat(seg.style.height));
                if (type.includes('hold')) tx = -(parseFloat(seg.style.left) + parseFloat(seg.style.width));

                track.style.transition = `transform ` + dur + `s linear`;
                track.style.transform = `translate(` + tx + `px, ` + ty + `px)`;

                const start = Date.now();
                const timer = setInterval(() => {
                    const elapsed = (Date.now() - start) / 1000;
                    const pc = Math.min((elapsed / dur) * 100, 100);
                    seg.style.setProperty('--progress', pc + '%');
                    if (type === 'inhale') ball.style.transform = `translate(-50%, -50%) scale(` + (1 + (pc / 100) * 1.8) + `)`;
                    if (type === 'exhale') ball.style.transform = `translate(-50%, -50%) scale(` + (2.8 - (pc / 100) * 1.8) + `)`;
                    if (pc >= 100 || !isRunning) clearInterval(timer);
                }, 30);

                await new Promise(r => setTimeout(r, dur * 1000));

                if (seg.dataset.endOfCycle === 'true' && isRunning) {
                    breathCounter++;
                    countDisplay.innerText = breathCounter;
                }
                idx++;
            }
        }

        function softReset() {
            isRunning = false;
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            breathCounter = 0;
            sessionSeconds = 0;
            countDisplay.innerText = '0';
            document.getElementById('timer').innerText = '00:00:00';
            status.innerText = 'Ready';
            status.style.color = 'var(--path-blue)';
            btn.innerText = "Begin Practice";
            document.getElementById('inputWrapper').classList.remove('hidden');
            document.getElementById('labWrapper').classList.remove('hidden');
            track.style.transition = 'none';
            track.style.transform = 'translate(0,0)';
            ball.style.transform = 'translate(-50%, -50%) scale(1)';
            modal.style.display = 'none';
        }

        restartBtn.onclick = softReset;

        btn.onclick = async function() {
            if (!isRunning) {
                await initAudio();
                isRunning = true;
                this.innerText = "RESET";
                document.getElementById('inputWrapper').classList.add('hidden');
                document.getElementById('labWrapper').classList.add('hidden');
                engine();
                const clock = setInterval(() => {
                    if (isRunning) {
                        sessionSeconds++;
                        document.getElementById('timer').innerText = new Date(sessionSeconds * 1000).toISOString().substr(11, 8);
                    } else {
                        clearInterval(clock);
                    }
                }, 1000);
            } else {
                isRunning = false;
                if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                document.getElementById('final-breaths').innerText = breathCounter;
                document.getElementById('final-time').innerText = document.getElementById('timer').innerText;
                modal.style.display = 'flex';
            }
        };
    </script>
</body>
</html>
